name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    - name: Build release binaries
      run: ./gradlew build
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          gatotauth-platforms/velocity/build/libs/*.jar
          gatotauth-platforms/paper/build/libs/*.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
